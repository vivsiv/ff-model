# Registry of which raw columns from each source's silver tables are candidates for use in training.
# Keyed by data source then by table name within that source.
#
# "identity" - columns used for joins/grouping/output.
# "stats" - columns used as features or to compute features. Either a flat list, or (for
#   tables where it matters, e.g. player_stats/snap_counts) split into "counting"/"rate"
#   sub-lists: "counting" stats are season-total counts (e.g. receiving_yards) eligible for
#   gold.py's per-game transform; "rate" stats are already normalized (e.g. target_share,
#   passing_cpoe) and are not divided by games again.
# "targets" - columns that will be predicted.

nflverse:
  player_stats:
    identity:
      - player_id
      - player_display_name
      - position
      - season
      - recent_team

    stats:
      counting:
        # Overall
        - games  # NOTE: not divided by itself for the per-game transform (see gold.py) --
                 # kept here since it genuinely is a counting stat, just the denominator.

        # Passing
        - completions
        - attempts
        - passing_yards
        - passing_tds
        - passing_interceptions
        - passing_first_downs
        - passing_2pt_conversions
        - passing_air_yards
        - passing_yards_after_catch
        - sacks_suffered
        - sack_yards_lost
        - sack_fumbles
        - sack_fumbles_lost
        - passing_10
        - passing_16
        - passing_20
        - passing_40
        - passing_epa

        # Rushing
        - carries
        - rushing_yards
        - rushing_tds
        - rushing_first_downs
        - rushing_2pt_conversions
        - rushing_fumbles
        - rushing_fumbles_lost
        - rushing_10
        - rushing_12
        - rushing_20
        - rushing_40
        - rushing_epa

        # Receiving
        - receptions
        - targets
        - receiving_yards
        - receiving_tds
        - receiving_first_downs
        - receiving_2pt_conversions
        - receiving_fumbles
        - receiving_fumbles_lost
        - receiving_air_yards
        - receiving_yards_after_catch
        - receiving_10
        - receiving_16
        - receiving_20
        - receiving_40
        - receiving_epa

        # Fantasy
        - fantasy_points
        - fantasy_points_ppr

      rate:
        - passing_cpoe
        - pacr
        - racr
        - target_share
        - air_yards_share
        - wopr
        - ppr_points_per_game  # derived: fantasy_points_ppr / games (0 if games == 0), computed in build_player_stats (nflverse.py)

    targets:
      - fantasy_points
      - fantasy_points_ppr
      - ppr_points_per_game

  team_stats:
    identity:
      - team
      - season

    stats:
      # Passing
      - completions
      - attempts
      - passing_yards
      - passing_tds
      - passing_interceptions
      - passing_first_downs
      - passing_2pt_conversions
      - passing_air_yards
      - passing_yards_after_catch
      - sacks_suffered
      - sack_yards_lost
      - sack_fumbles
      - sack_fumbles_lost
      - passing_10
      - passing_16
      - passing_20
      - passing_40
      - passing_epa
      - passing_cpoe

      # Rushing
      - carries
      - rushing_yards
      - rushing_tds
      - rushing_first_downs
      - rushing_2pt_conversions
      - rushing_fumbles
      - rushing_fumbles_lost
      - rushing_10
      - rushing_12
      - rushing_20
      - rushing_40
      - rushing_epa

      # Receiving
      - receptions
      - targets
      - receiving_yards
      - receiving_tds
      - receiving_first_downs
      - receiving_2pt_conversions
      - receiving_fumbles
      - receiving_fumbles_lost
      - receiving_air_yards
      - receiving_yards_after_catch
      - receiving_10
      - receiving_16
      - receiving_20
      - receiving_40
      - receiving_epa

  draft_picks:
    identity:
      - player_id
      - season

    stats:
      - draft_pick    # (round - 1) * 32 + pick, computed in build_draft_picks from "round"/"pick"
      - age_at_draft  # renamed from "age" in build_draft_picks

  snap_counts:
    identity:
      - player_id
      - season

    stats:
      # Only 2013+
      counting:
        - offense_snaps  # season total, summed across games in build_snap_counts
      rate:
        - offense_pct    # season average share of team offensive snaps, mean across games
