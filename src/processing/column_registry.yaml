# Registry of which raw columns from each silver table are candidates for features.
#
# "included" and "excluded" are exhaustive and mutually exclusive for a given table's
# column set.
# "targets" are columns that will be predicted.

player_stats:
  included:
    # Passing
    - completions
    - attempts
    - passing_yards
    - passing_tds
    - passing_interceptions
    - passing_first_downs
    - passing_2pt_conversions
    - passing_air_yards
    - passing_yards_after_catch
    - sacks_suffered
    - sack_yards_lost
    - sack_fumbles
    - sack_fumbles_lost
    - passing_10
    - passing_16
    - passing_20
    - passing_40
    - passing_epa
    - passing_cpoe
    - pacr

    # Rushing
    - carries
    - rushing_yards
    - rushing_tds
    - rushing_first_downs
    - rushing_2pt_conversions
    - rushing_fumbles
    - rushing_fumbles_lost
    - rushing_10
    - rushing_12
    - rushing_20
    - rushing_40
    - rushing_epa

    # Receiving
    - receptions
    - targets
    - receiving_yards
    - receiving_tds
    - receiving_first_downs
    - receiving_2pt_conversions
    - receiving_fumbles
    - receiving_fumbles_lost
    - receiving_air_yards
    - receiving_yards_after_catch
    - receiving_10
    - receiving_16
    - receiving_20
    - receiving_40
    - receiving_epa
    - racr
    - target_share
    - air_yards_share
    - wopr
    # Fantasy
    - fantasy_points
    - fantasy_points_ppr

  targets:
    - fantasy_points
    - fantasy_points_ppr

  excluded:
    # Identity / context -- necessary columns for other operations (joins, grouping) are kept in by those operations.
    - player_id
    - player_name
    - player_display_name
    - position
    - position_group
    - season
    - season_type
    - recent_team
    - games
    - headshot_url

    # Defense
    - def_tackles_solo
    - def_tackles_with_assist
    - def_tackle_assists
    - def_tackles_for_loss
    - def_tackles_for_loss_yards
    - def_fumbles_forced
    - def_sacks
    - def_sack_yards
    - def_qb_hits
    - def_interceptions
    - def_interception_yards
    - def_pass_defended
    - def_tds
    - def_fumbles
    - def_safeties
    - fumble_recovery_own
    - fumble_recovery_yards_own
    - fumble_recovery_opp
    - fumble_recovery_yards_opp
    - fumble_recovery_tds
    - fumbles_forced_by_opp
    - misc_yards

    # Special Teams
    - fg_made
    - fg_att
    - fg_missed
    - fg_blocked
    - fg_long
    - fg_pct
    - fg_made_0_19
    - fg_made_20_29
    - fg_made_30_39
    - fg_made_40_49
    - fg_made_50_59
    - fg_made_60_
    - fg_missed_0_19
    - fg_missed_20_29
    - fg_missed_30_39
    - fg_missed_40_49
    - fg_missed_50_59
    - fg_missed_60_
    - fg_made_list
    - fg_missed_list
    - fg_blocked_list
    - fg_made_distance
    - fg_missed_distance
    - fg_blocked_distance
    - pat_made
    - pat_att
    - pat_missed
    - pat_blocked
    - pat_pct
    - gwfg_made
    - gwfg_att
    - gwfg_missed
    - gwfg_blocked
    - gwfg_distance_list
    - pt_att
    - pt_blocked
    - pt_long
    - pt_yards
    - pt_inside_20
    - pt_out_of_bounds
    - pt_downed
    - pt_touchback
    - pt_fair_caught
    - pt_returned
    - pt_return_yards
    - pt_return_tds
    - pt_net_yards
    - special_teams_tds
    - punt_returns
    - punt_return_yards
    - kickoff_returns
    - kickoff_return_yards

    # Aggregate fumble counts overlapping with the position-specific ones already included above.
    - fumbles_total
    - fumbles_lost_total
    - fumbles_not_forced
    - fumbles_out_of_bounds

    # Penalties
    - penalties
    - penalty_yards
