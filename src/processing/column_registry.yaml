# Registry of which raw columns from each source's silver tables are candidates for use in training.
# Keyed by data source then by table name within that source.
#
# "identity" - columns used for joins/grouping/output.
# "stats" - columns used as features or to compute features.
# "targets" - columns that will be predicted.

nflverse:
  player_stats:
    identity:
      - player_id
      - player_display_name
      - position
      - season
      - recent_team

    stats:
      # Overall
      - games

      # Passing
      - completions
      - attempts
      - passing_yards
      - passing_tds
      - passing_interceptions
      - passing_first_downs
      - passing_2pt_conversions
      - passing_air_yards
      - passing_yards_after_catch
      - sacks_suffered
      - sack_yards_lost
      - sack_fumbles
      - sack_fumbles_lost
      - passing_10
      - passing_16
      - passing_20
      - passing_40
      - passing_epa
      - passing_cpoe
      - pacr

      # Rushing
      - carries
      - rushing_yards
      - rushing_tds
      - rushing_first_downs
      - rushing_2pt_conversions
      - rushing_fumbles
      - rushing_fumbles_lost
      - rushing_10
      - rushing_12
      - rushing_20
      - rushing_40
      - rushing_epa

      # Receiving
      - receptions
      - targets
      - receiving_yards
      - receiving_tds
      - receiving_first_downs
      - receiving_2pt_conversions
      - receiving_fumbles
      - receiving_fumbles_lost
      - receiving_air_yards
      - receiving_yards_after_catch
      - receiving_10
      - receiving_16
      - receiving_20
      - receiving_40
      - receiving_epa
      - racr
      - target_share
      - air_yards_share
      - wopr

      # Fantasy 
      - fantasy_points
      - fantasy_points_ppr

    targets:
      - fantasy_points
      - fantasy_points_ppr

  team_stats:
    identity:
      - team
      - season

    stats:
      # Passing
      - completions
      - attempts
      - passing_yards
      - passing_tds
      - passing_interceptions
      - passing_first_downs
      - passing_2pt_conversions
      - passing_air_yards
      - passing_yards_after_catch
      - sacks_suffered
      - sack_yards_lost
      - sack_fumbles
      - sack_fumbles_lost
      - passing_10
      - passing_16
      - passing_20
      - passing_40
      - passing_epa
      - passing_cpoe

      # Rushing
      - carries
      - rushing_yards
      - rushing_tds
      - rushing_first_downs
      - rushing_2pt_conversions
      - rushing_fumbles
      - rushing_fumbles_lost
      - rushing_10
      - rushing_12
      - rushing_20
      - rushing_40
      - rushing_epa

      # Receiving
      - receptions
      - targets
      - receiving_yards
      - receiving_tds
      - receiving_first_downs
      - receiving_2pt_conversions
      - receiving_fumbles
      - receiving_fumbles_lost
      - receiving_air_yards
      - receiving_yards_after_catch
      - receiving_10
      - receiving_16
      - receiving_20
      - receiving_40
      - receiving_epa
