# Data prep config for the ppr_points_per_game target -- see TabularModelDataPrep.
#
# features.columns (mode: exclude) excludes each counting stat's own raw current-season
# value and _trend (both of which conflate per-game rate with games missed for a player
# who played a partial season), plus every fantasy_points*/ppr_points_per_game* column
# (the targets, or directly derived from them). See column_registry.yaml's "counting" stat
# lists (player_stats + snap_counts) if this needs to be regenerated by hand.
#
# sample_weights: nearly half of all rows (46.8%) have target <= 5 ppr_points_per_game --
# bench/inactive-level seasons that are trivial to get roughly right under squared-error
# loss, and pull every prediction toward a conservative central estimate rather than
# differentiating among fantasy-relevant players. Confirmed via test-set bias-by-bucket:
# the model over-predicts every bucket below ~6 ppg and under-predicts every bucket above
# it, worst at the top (actual > 20 ppg: mean bias -5.0). Graduated low-end weighting
# (rather than a hard 0 cutoff) keeps some signal from the low-production rows -- so the
# model can still make reasonable predictions in that range -- while still de-emphasizing
# them relative to the fantasy-relevant population.
target: ppr_points_per_game
split:
  eval_data_years: 1
  test_data_years: 1
  num_training_seasons: 10
sample_weights:
  buckets:
    - min: 0.0
      weight: 0.1
    - min: 3.0
      weight: 0.2
    - min: 5.0
      weight: 0.5
    - min: 8.0
      weight: .95
    - min: 10.0
      weight: 1.0
features:
  mode: exclude
  columns:
  - fantasy_points*
  - ppr_points_per_game*
  - games
  - completions
  - attempts
  - passing_yards
  - passing_tds
  - passing_interceptions
  - passing_first_downs
  - passing_2pt_conversions
  - passing_air_yards
  - passing_yards_after_catch
  - sacks_suffered
  - sack_yards_lost
  - sack_fumbles
  - sack_fumbles_lost
  - passing_10
  - passing_16
  - passing_20
  - passing_40
  - passing_epa
  - carries
  - rushing_yards
  - rushing_tds
  - rushing_first_downs
  - rushing_2pt_conversions
  - rushing_fumbles
  - rushing_fumbles_lost
  - rushing_10
  - rushing_12
  - rushing_20
  - rushing_40
  - rushing_epa
  - receptions
  - targets
  - receiving_yards
  - receiving_tds
  - receiving_first_downs
  - receiving_2pt_conversions
  - receiving_fumbles
  - receiving_fumbles_lost
  - receiving_air_yards
  - receiving_yards_after_catch
