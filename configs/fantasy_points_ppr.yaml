# Data prep config for the fantasy_points_ppr target -- see TabularModelDataPrep.
#
# features.columns (mode: exclude) excludes each counting stat's own raw current-season
# value and _trend (both of which conflate per-game rate with games missed for a player
# who played a partial season), plus every fantasy_points*/ppr_points_per_game* column
# (the targets, or directly derived from them). Same exclusion list as
# ppr_points_per_game.yaml -- see column_registry.yaml's "counting" stat lists
# (player_stats + snap_counts) if this needs to be regenerated by hand.
#
# sample_weights: this target is a season total rather than a per-game rate, so the same
# flooding problem shows up on a different scale -- test-set bias-by-bucket goes from
# +26 (actual <= 0) down through +7.4 (actual 100-150) before flipping to -38.3 (150-250)
# and -103.2 (250+). Graduated low-end weighting (mirroring ppr_points_per_game.yaml's
# shape, at bucket boundaries matching this target's own bias-by-bucket breaks) keeps some
# signal from the low-production rows rather than a hard 0 cutoff, while still de-emphasizing
# them relative to the fantasy-relevant population. Revisit these breakpoints/weights if
# retraining against this config doesn't show the expected improvement.
target: fantasy_points_ppr
split:
  eval_data_years: 1
  test_data_years: 1
  num_training_seasons: 10
sample_weights:
  buckets:
  - min: 0.0
    weight: 0.05
  - min: 25.0
    weight: 0.2
  - min: 50.0
    weight: 0.35
  - min: 100.0
    weight: 0.75
  - min: 150.0
    weight: 1.0
features:
  mode: exclude
  columns:
  - fantasy_points*
  - ppr_points_per_game*
  - games
  - completions
  - attempts
  - passing_yards
  - passing_tds
  - passing_interceptions
  - passing_first_downs
  - passing_2pt_conversions
  - passing_air_yards
  - passing_yards_after_catch
  - sacks_suffered
  - sack_yards_lost
  - sack_fumbles
  - sack_fumbles_lost
  - passing_10
  - passing_16
  - passing_20
  - passing_40
  - passing_epa
  - carries
  - rushing_yards
  - rushing_tds
  - rushing_first_downs
  - rushing_2pt_conversions
  - rushing_fumbles
  - rushing_fumbles_lost
  - rushing_10
  - rushing_12
  - rushing_20
  - rushing_40
  - rushing_epa
  - receptions
  - targets
  - receiving_yards
  - receiving_tds
  - receiving_first_downs
  - receiving_2pt_conversions
  - receiving_fumbles
  - receiving_fumbles_lost
  - receiving_air_yards
  - receiving_yards_after_catch
  - receiving_10
