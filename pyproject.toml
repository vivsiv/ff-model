[project]
name = "ff-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.4",
    "matplotlib>=3.10.8",
    "mlflow>=3.11.1",
    "nflreadpy>=0.1.5",
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
]

# torch is installed through one of two mutually exclusive dependency groups so the accelerator build can be chosen:
#   - gpu (default): torch from PyPI. On Linux that is the CUDA-enabled build (what a cloud GPU box needs); macOS has
#     no CUDA wheels, so it gets the standard build.
#   - cpu (used by CI): on Linux the CPU-only build from the PyTorch index, avoiding several GB of CUDA libraries.
#     Select with `uv sync --no-group gpu --group cpu`.
[dependency-groups]
gpu = ["torch>=2.14.1"]
cpu = ["torch>=2.14.1"]

[tool.uv]
default-groups = ["gpu"]
conflicts = [[{ group = "gpu" }, { group = "cpu" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = [
    "integration: slow tests that load real generated data from disk (e.g. data/gold/*.csv); excluded by default, run explicitly with `pytest -m integration`",
]
